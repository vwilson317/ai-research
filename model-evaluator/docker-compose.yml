services:
  evaluator:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - eval-data:/data
      # Your iCloud voice-note transcripts (read-only). In the app, import from /voice-notes.
      - ${VOICE_NOTES_DIR:-./voice-notes}:/voice-notes:ro
    restart: unless-stopped

volumes:
  eval-data:
